name: Long-Form Cinematic AI Pipeline

on:
  schedule:
    - cron: '30 00 * * *' # Roz Subah 5:00 Baje (IST)
    - cron: '30 12 * * *' # Roz Shaam 8:00 Baje (IST)
  workflow_dispatch:      # Manual Run Button

permissions:
  contents: write

jobs:
  # ==========================================
  # STAGE 1: AI SCRIPT & AUDIO GENERATION
  # ==========================================
  stage1-script-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies (Script & Audio)
        run: pip install requests mutagen edge-tts pillow
        
      - name: Generate AI Prompts (BazaarLink Auto)
        env:
          BAZAAR_API_KEY: ${{ secrets.BAZAAR_API_KEY }}
        run: python -u auto_prompt.py
        
      - name: Generate Voiceover (Edge TTS)
        run: python -u generate_audio.py
        
      - name: Commit updated txt files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add story.txt character.txt metadata.txt prompts.txt music_prompt.txt
          git commit -m "Auto-updated script files" || echo "No changes to commit"
          git push
          
      - name: Upload Script & Audio Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: script-audio-data
          path: |
            prompts.txt
            metadata.txt
            music_prompt.txt
            audio_timestamps.json
            audio_clips/
            
      - name: Set Matrix for Image Generation
        id: set-matrix
        run: |
          # Safely count lines and pass to Python
          if [ -f prompts.txt ]; then
            SCENE_COUNT=$(grep -c '|' prompts.txt || echo "0")
          else
            SCENE_COUNT=0
          fi
          
          if [ "$SCENE_COUNT" -eq "0" ]; then 
            echo "❌ No valid scenes found in prompts.txt. Exiting."
            exit 1
          fi
          
          echo "✅ Found $SCENE_COUNT scenes."
          export SCENE_COUNT
          
          MATRIX_JSON=$(python3 -c "import os, json; print(json.dumps(list(range(1, int(os.environ['SCENE_COUNT']) + 1))))")
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

  # ==========================================
  # STAGE 2: BING IMAGE GENERATION (16:9 FIX)
  # ==========================================
  stage2-images:
    needs: stage1-script-audio
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1  # 🔴 VERY IMPORTANT: Set to 1 to avoid Bing banning your IP!
      matrix:
        machine_id: ${{ fromJson(needs.stage1-script-audio.outputs.matrix) }}
        
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Playwright & Image Libs
        run: |
          pip install requests playwright pillow
          playwright install chromium
          playwright install-deps chromium
          
      - name: Download Script Artifacts
        uses: actions/download-artifact@v4
        with:
          name: script-audio-data
          
      - name: Generate & Format Image (Bing AI + 16:9)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python -u generate_image.py ${{ matrix.machine_id }}
        
      - name: Upload Scene Image
        uses: actions/upload-artifact@v4
        with:
          name: image_machine_${{ matrix.machine_id }}
          path: scene_images/

  # ==========================================
  # STAGE 3: EDITING & UPLOAD (LONG FORMAT)
  # ==========================================
  stage3-edit-upload:
    needs: stage2-images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install System Dependencies (FFmpeg & AI)
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg zip
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib requests transformers torch scipy pillow
          
      - name: Download Script & Audio Artifacts
        uses: actions/download-artifact@v4
        with:
          name: script-audio-data
          
      - name: Download All Image Artifacts
        uses: actions/download-artifact@v4
        with:
          path: scene_images/
          pattern: image_machine_*
          merge-multiple: true
          
      - name: Generate Local AI BGM Loop
        run: python -u generate_music.py
        
      - name: Master Assembly (Sync Audio, Images & Ken Burns)
        run: python -u process_videos.py
        
      - name: Upload Final Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Final_Long_Video
          path: final_output/Final_Masterpiece.mp4
          
      - name: Auto Upload to YouTube
        env:
          YOUTUBE_TOKEN_BASE64: ${{ secrets.YOUTUBE_TOKEN_BASE64 }}
        run: python -u upload_youtube.py
