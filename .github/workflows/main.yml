name: Ultimate Agency Automation Pipeline

on:
  schedule:
    - cron: '30 00 * * *' # Subah 5:00 Baje (IST)
    - cron: '30 12 * * *' # Shaam 8:00 Baje (IST)
  workflow_dispatch:      # Jab chahe manually Run dabayein

permissions:
  contents: write

jobs:
  # ==========================================
  # STAGE 1: BRAIN (JSON) & VOICE (EDGE-TTS)
  # ==========================================
  stage1-brain-voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Stage 1 Dependencies
        run: pip install openai edge-tts mutagen requests
        
      - name: Run AI Director (Generate JSON Script)
        env:
          XKIRO_API_KEY: ${{ secrets.XKIRO_API_KEY }}
        run: python -u generate_script.py
        
      - name: Generate Voiceover & Timestamps
        run: python -u generate_audio.py
        
      - name: Calculate Dynamic Matrix for Images
        id: set-matrix
        run: |
          # script_data.json padh kar automatically total scenes nikalega
          MATRIX_JSON=$(python3 -c "import json; scenes=json.load(open('script_data.json')); print(json.dumps([s['scene'] for s in scenes]))")
          echo "✅ Scenes Found: $MATRIX_JSON"
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT
          
      - name: Upload Core Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: core-assets
          path: |
            client_setup.json
            script_data.json
            audio_timestamps.json
            audio_clips/
            
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

  # ==========================================
  # STAGE 2: BING IMAGES & SMART CROPPER
  # ==========================================
  stage2-visuals:
    needs: stage1-brain-voice
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1  # 🔴 BING BAN SE BACHNE KE LIYE (1 by 1)
      matrix:
        scene_id: ${{ fromJson(needs.stage1-brain-voice.outputs.matrix) }}
        
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Playwright & Pillow
        run: |
          pip install playwright pillow
          playwright install chromium
          playwright install-deps chromium
          
      - name: Download Core Assets
        uses: actions/download-artifact@v4
        with:
          name: core-assets
          
      - name: Scrape & Auto-Crop Image
        run: python -u generate_images.py ${{ matrix.scene_id }}
        
      - name: Upload Scene Image
        uses: actions/upload-artifact@v4
        with:
          name: image_scene_${{ matrix.scene_id }}
          path: scene_images/

  # ==========================================
  # STAGE 3: LIVE SFX & FFMPEG MASTER ASSEMBLY
  # ==========================================
  stage3-assembly:
    needs: stage2-visuals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-liberation
          pip install requests
          
      - name: Download Core Assets
        uses: actions/download-artifact@v4
        with:
          name: core-assets
          
      - name: Download All Scene Images
        uses: actions/download-artifact@v4
        with:
          path: scene_images/
          pattern: image_scene_*
          merge-multiple: true
          
      - name: Fetch Live Sound Effects (Freesound)
        env:
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
        run: python -u fetch_assets.py
        
      - name: 🎬 Render Final Masterpiece (FFmpeg)
        run: python -u master_assembly.py
        
      - name: 📤 Upload Final Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FINAL_AGENCY_VIDEO
          path: final_output/FINAL_MASTERPIECE.mp4
