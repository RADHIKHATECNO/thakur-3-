name: Advanced Cinematic Pipeline

on:
  schedule:
    - cron: '30 00 * * *' 
    - cron: '30 12 * * *' 
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install FFmpeg
      run: sudo apt-get update && sudo apt-get install -y ffmpeg

    - name: Install Dependencies
      run: pip install -r requirements.txt

    - name: Install Playwright
      run: playwright install chromium

    - name: 1. Generate Script
      run: python auto_prompt.py
      env:
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    - name: 2. Generate Voice
      run: python generate_voice.py
      env:
        ELEVENLABS_API_KEYS: ${{ secrets.ELEVENLABS_API_KEYS }}

    - name: 3. Generate Images
      run: python generate_image.py

    - name: 4. Generate Videos
      run: |
        count=1
        while [ -f "scene_images/scene_$count.jpg" ]; do
           python generate_video.py $count
           count=$((count + 1))
        done

    - name: 5. Process & Edit
      run: python process_videos.py

    - name: 6. Upload to YouTube
      run: python upload_youtube.py
      env:
        YOUTUBE_TOKEN_BASE64: ${{ secrets.YOUTUBE_TOKEN_BASE64 }}
