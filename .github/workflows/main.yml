name: Long-Form Cinematic AI Pipeline

on:
  schedule:
    - cron: '30 00 * * *'  # Roz Subah 5:00 Baje (IST)
    - cron: '30 12 * * *'  # Roz Shaam 8:00 Baje (IST)
  workflow_dispatch:       # Manual Run Button

permissions:
  contents: write

jobs:
  # ==========================================
  # STAGE 1: AI SCRIPT & AUDIO GENERATION
  # ==========================================
  stage1-script-audio:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install Dependencies
      run: pip install openai requests mutagen
        
    - name: Generate AI Prompts (Cohere API)
      run: python auto_prompt.py
      env:
        COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}

    - name: Generate Voiceover (ElevenLabs)
      run: python generate_audio.py
      
    - name: Commit updated txt files
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add story.txt character.txt metadata.txt prompts.txt music_prompt.txt
        git commit -m "Auto-updated script files" || echo "No changes to commit"
        git push
        
    - uses: actions/upload-artifact@v4
      with:
        name: script-audio-data
        path: |
          prompts.txt
          metadata.txt
          music_prompt.txt
          voiceover.mp3
          audio_timestamps.json
          
    - id: set-matrix
      run: |
        count=$(grep -c '^' prompts.txt || echo 0)
        if [ "$count" -eq 0 ]; then exit 1; fi
        matrix_json=$(python3 -c "import json; print(json.dumps(list(range(1, $count + 1))))")
        echo "matrix=$matrix_json" >> $GITHUB_OUTPUT
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

  # ==========================================
  # STAGE 2: BING IMAGE GENERATION (16:9 FIX)
  # ==========================================
  stage2-images:
    needs: stage1-script-audio
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        machine_id: ${{ fromJson(needs.stage1-script-audio.outputs.matrix) }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install Playwright & Image Libs
      run: |
        pip install requests playwright pillow
        playwright install chromium
        playwright install-deps chromium
        
    - uses: actions/download-artifact@v4
      with:
        name: script-audio-data
        
    - name: Generate & Format Image (Bing AI 16:9)
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: python generate_image.py ${{ matrix.machine_id }}
      
    - uses: actions/upload-artifact@v4
      with:
        name: image_machine_${{ matrix.machine_id }}
        path: scene_images/

  # ==========================================
  # STAGE 3: EDITING & UPLOAD (LONG FORMAT)
  # ==========================================
  stage3-edit-upload:
    needs: stage2-images
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install System Dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y ffmpeg zip
        pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib requests transformers torch scipy pillow
        
    - uses: actions/download-artifact@v4
      with:
        name: script-audio-data
        
    - uses: actions/download-artifact@v4
      with:
        path: scene_images/
        pattern: image_machine_*
        merge-multiple: true

    - name: Generate Local AI BGM Loop
      run: python generate_music.py
        
    - name: Master Assembly (Sync Audio, Images & Ken Burns)
      run: python process_videos.py
      
    - uses: actions/upload-artifact@v4
      with:
        name: Final_Long_Video
        path: final_output/Final_Masterpiece.mp4
        
    - name: Auto Upload to YouTube
      env:
        YOUTUBE_TOKEN_BASE64: ${{ secrets.YOUTUBE_TOKEN_BASE64 }}
      run: python upload_youtube.py
